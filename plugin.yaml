schema: mcpg.dev/plugin/v1
id: dev.mcpg.storage.gcs
name: Cloud Storage Objects Watch Strategy
license: Apache-2.0
description: |
  Watches a Google Cloud Storage bucket and reports each object created,
  modified or deleted under a prefix as the shared `object.changed` MCP
  Event. The `gcs_objects` strategy lists the prefix on a cadence and resumes
  exactly after a restart; a Pub/Sub subscription to the bucket's
  notifications, when given, makes it list at once. In `notifications` mode
  it reads only that subscription, for a bucket too large to list, and
  acknowledges each notification once the gateway has stored its event.
  Credentials are a Google credentials file (a service account key, an
  authorized user file or a Workload Identity Federation configuration) or
  Application Default Credentials.
class: watch_strategy
runtime: native-cdylib-v1
protocol_version: "1.0"
required_capabilities: [network_outbound]
# MCP Events: the prefix as an inventory of objects.
watch_strategies:
  - kind: gcs_objects
    placement: single_owner
    resume: true
    event_types:
      - name: object.changed
        description: An object under the watched prefix was created, modified or deleted.
        payload_schema:
          type: object
          required: [op, store, location, key]
          properties:
            op: { enum: [created, modified, deleted] }
            store: { type: string, description: The kind of store - gcs here. }
            location: { type: string, description: "gs://bucket/prefix/." }
            key: { type: string, description: The object name relative to the prefix. }
            size: { type: integer }
            modifiedAt: { type: string, description: When it last changed, RFC 3339. }
            etag: { type: string }
            version: { type: string, description: The object generation. }
            eventName: { type: string, description: "The notification, in notifications mode: OBJECT_FINALIZE, OBJECT_DELETE, OBJECT_ARCHIVE." }
